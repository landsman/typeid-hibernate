name: Test

on:
  workflow_dispatch:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: 'Set up JDK 21'
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'zulu'
          cache: gradle

      - name: 'Gradle Wrapper Validation'
        uses: gradle/actions/wrapper-validation@v3

      - name: 'Setup Gradle Dependencies Cache'
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-caches-${{ hashFiles('**/*.gradle', '**/*.gradle.kts') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: 'Setup Gradle Wrapper Cache'
        uses: actions/cache@v4
        with:
          path: ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-wrapper-${{ hashFiles('**/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-wrapper-

      - name: 'Grant execute permission for gradlew'
        run: chmod +x ./gradlew

      - name: 'Build and Test with Gradle'
        run: ./gradlew build test

  # The scan lives in landsman/config and is called, not copied: that repo is
  # public, so this needs nothing configured at either end.
  #
  # p/java because that is what is here — there is no Kotlin, and p/gradle does
  # not exist in the registry. p/secrets is named even though the shared workflow
  # adds it to every caller, because `packs` replaces its default rather than
  # extending it: without it, this would scan for no secrets at all until that
  # baseline lands. Naming a pack twice costs nothing.
  security:
    uses: landsman/config/.github/workflows/semgrep.yml@main
    with:
      packs: p/secrets p/java
